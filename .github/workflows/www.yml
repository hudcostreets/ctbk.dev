name: GitHub Pages
on:
  push:
    branches:
      - www
      - scrns-playwright-test
  workflow_dispatch:
jobs:
  build:
    name: Build + deploy www branch to ctbk.dev via GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.WWW_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: www/pnpm-lock.yaml
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('www/pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright
      - name: Install
        working-directory: www
        run: pnpm install
      - name: Install Playwright Chromium
        working-directory: www
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: www
        run: |
          pnpm build
          # Copy index.html to 404.html for GHP SPA routing
          cp dist/index.html dist/404.html
      - name: Serve and generate screenshots
        working-directory: www
        run: |
          # Start server in background (serve with SPA fallback)
          pnpm exec serve dist -l 8080 -s &
          SERVER_PID=$!
          sleep 2
          # Generate screenshots
          pnpm scrns -E playwright -h localhost:8080 -l 120000
          # Stop server
          kill $SERVER_PID
      - name: Push + re-run, if screenshots changed
        id: screenshots
        run: |
          if git diff --name-only -- www/public/screenshots | grep -v ctbk-stations; then
              git add www/public/screenshots
              git config --global user.name "GitHub Actions"
              git config --global user.email "github@actions"
              git commit -m "Update screenshots"
              git pull origin www
              echo "Pushing www"
              git push origin HEAD:www
              echo "Updating main branch"
              git fetch --unshallow origin main
              git pull origin main
              git push origin HEAD:main
              echo "REGENERATED=true" >> $GITHUB_OUTPUT
          fi
      - name: Deploy to GH Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: steps.screenshots.outputs.REGENERATED != 'true'
        with:
          branch: ghp
          folder: www/dist
