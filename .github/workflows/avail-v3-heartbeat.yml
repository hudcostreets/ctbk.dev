name: avail-v3 cascade heartbeat
on:
  schedule:
    - cron: '0 */6 * * *'  # every 6h
  workflow_dispatch:
    inputs:
      lag_multiplier:
        description: 'Per-cadence max lag = mult * cadence_min (default 2)'
        required: false
        default: '2'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync deps + activate venv
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run heartbeat
        run: |
          ctbk avail-v3-heartbeat -l "${{ inputs.lag_multiplier || '2' }}"
