[project]
name = "ctbk"
dynamic = ["version"]
description = "NYC Citi Bike trip data pipeline and visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiobotocore>=2.22.0",
    "boto3>=1.37.3",
    "botocore>=1.37.3",
    "click>=8.2.1",
    "dvc-s3>=3.2.2",
    "fsspec>=2025.5.1",
    "geopy>=2.4.1",
    "graphviz>=0.20.3",
    "gzip-stream>=1.2.0",
    "html_dsl>=0.5.0",
    "kaleido>=0.2.1",
    "lxml>=5.4.0",
    "numpy>=2.2.6",
    # Pinned for byte-reproducible parquet output
    "pandas==2.3.3",
    "plotly>=6.1.2",
    "polars>=1.41.0",
    # Pinned for byte-reproducible parquet output
    "pyarrow==22.0.0",
    "pyrmts",
    "pyrmts-engine",
    "pyrmts-ops",
    "python-dateutil>=2.9.0.post0",
    "s2cell>=1.8.0",
    "s3fs>=2025.5.1",
    "SQLAlchemy>=2.0.41",
    "utz>=0.20.0",
    "dvx",
]

[tool.uv.sources]
# Pinned (default):
# dvx: pinned past v0.5.0 (PyPI's latest) for `cache comm` — the dir-manifest
# audit tool — plus `gc --safe` and the `.dvc`-rewrite/gitignore fixes.
dvx           = { git = "https://github.com/runsascoded/dvx.git", rev = "9c22fc08c" }
pyrmts        = { git = "https://github.com/runsascoded/pyrmts.git", rev = "3ef0757", subdirectory = "python/pyrmts" }
pyrmts-engine = { git = "https://github.com/runsascoded/pyrmts.git", rev = "3ef0757", subdirectory = "python/pyrmts_engine" }
pyrmts-ops    = { git = "https://github.com/runsascoded/pyrmts.git", rev = "3ef0757", subdirectory = "python/pyrmts_ops" }
# Local (dev) — swap all three together (the Python `pds l`): from ctbk, the
# `pyrmts` entry here is what resolves `pyrmts-engine`'s own `pyrmts` dep (its
# workspace source only applies inside the pyrmts repo). Don't commit this
# variant; note editable installs also break `gbfs/lambda/deploy.py`'s
# site-packages vendoring.
# pyrmts        = { path = "/Users/ryan/c/pyrmts/python/pyrmts", editable = true }
# pyrmts-engine = { path = "/Users/ryan/c/pyrmts/python/pyrmts_engine", editable = true }
# pyrmts-ops    = { path = "/Users/ryan/c/pyrmts/python/pyrmts_ops", editable = true }

[project.scripts]
ctbk = "ctbk.cli.main:main"
yms = "ctbk.cli.yms:yms"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ctbk"]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
