<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ctbk.dev - Citi Bike Dashboard</title>
    <meta property="og:title" content="ctbk.dev - Citi Bike Dashboard" />
    <meta property="og:description" content="NYC Citi Bike trip data: rides per month, station maps, and more." />
    <meta property="og:image" content="https://ctbk.dev/screenshots/ctbk-og-mosaic.jpg" />
    <meta property="og:url" content="https://ctbk.dev" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent FOUC: set theme and critical CSS before React loads -->
    <script>
      (function() {
        // Check URL param first (?theme=light or ?theme=dark)
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get('theme');
        var theme = (urlTheme === 'light' || urlTheme === 'dark') ? urlTheme : localStorage.getItem('ctbk-theme') || 'system';
        var actual = theme;
        if (theme === 'system') {
          actual = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', actual);
      })();
    </script>
    <style>
      :root {
        --bg-primary: #f5f7fa;
        --text-primary: #333333;
      }
      [data-theme="dark"] {
        --bg-primary: #1a1a1a;
        --text-primary: #e0e0e0;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-primary);
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics (RUM: page views + Core Web Vitals).
         Manual mode: ctbk.dev is on GH Pages, not proxied through CF, so
         the beacon JS reports CWV directly to CF's collector. Privacy:
         no cookies, no individual-visitor tracking. Free tier. -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4bd00e4ade70447c89813154f57c6260"}'></script>
  </body>
</html>
