name = "ctbk-gbfs-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# satori (og:image rendering) references `process.env` at runtime.
compatibility_flags = ["nodejs_compat"]

# Smart Placement: ask CF to migrate the Worker toward its heaviest
# bindings (R2 + D1 shard-registry, both ENAM).
[placement]
mode = "smart"

[vars]
CORS_ORIGIN = "*"
# R2 bucket name (S3-compat presigned URL path-style addressing).
R2_BUCKET_NAME = "ctbk"
# r2.dev public URL — anonymous direct reads from R2. Used as a sync
# `getUrl(path)` fallback when the browser opts out of presigning.
R2_PUBLIC_BASE_URL = "https://pub-4856603e85b34753b7e6bffb89411803.r2.dev"

# Bundle .ttf font files as raw bytes (satori og:image rendering).
# NOTE: defining ANY [[rules]] displaces wrangler's defaults, so the
# wasm rule (normally built-in) must be restated for resvg.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "d5746734-70ba-46aa-8780-be09e4837f0b"

[[r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Workers Analytics Engine: per-request data points (route, workerColo,
# perCallMs, status). Free up to 25M writes/day per account; queryable
# via the CF GraphQL API. Used to track per-route p50/p99 over time.
[[analytics_engine_datasets]]
binding = "PERF"
dataset = "ctbk_perf"

# Cron triggers (scheduled() handler in `index.ts`): refresh the
# /api/health snapshot cache + Slack alerts (threshold rules, posts
# firing/resolved transitions to `#ctbk-bot`; idempotent).
[triggers]
crons = ["* * * * *"]

# ─── Dev environment ───────────────────────────────────────────────────
# Sibling worker at `ctbk-gbfs-api-dev.ryan-0dc.workers.dev` for iterating
# on backend changes without touching production. Same R2/D1 bindings (so
# behavior is identical against real data); cron disabled (don't want both
# prod and dev firing Slack alerts every 5 minutes).
#
# Deploy: `wrangler deploy --env dev` from /gbfs/api. ~15s, no GHA.
# Secrets: set separately via `wrangler secret put --env dev <NAME>`
# (Slack token, etc.; reuse prod values).
# FE: pass `?api=dev` (or `VITE_API_BASE_DEV=…` at build time) to route
# queries at the dev worker — see `www/src/query/stations.ts`.
[env.dev]
name = "ctbk-gbfs-api-dev"

# Same Smart Placement on dev. CF needs a handful of invocations to
# gather routing telemetry before it migrates the Worker.
[env.dev.placement]
mode = "smart"

[env.dev.vars]
CORS_ORIGIN = "*"
R2_BUCKET_NAME = "ctbk"
R2_PUBLIC_BASE_URL = "https://pub-4856603e85b34753b7e6bffb89411803.r2.dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "d5746734-70ba-46aa-8780-be09e4837f0b"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Same AE binding on dev — diagnostic runs against dev should also write
# data points (dataset is shared with prod; filter by `script_name` in
# queries to disambiguate).
[[env.dev.analytics_engine_datasets]]
binding = "PERF"
dataset = "ctbk_perf"

# Disable cron on dev — prod already fires `*/5 * * * *` for Slack alerts;
# we don't want dev double-firing.
[env.dev.triggers]
crons = []
