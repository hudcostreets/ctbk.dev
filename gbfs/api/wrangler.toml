name = "ctbk-gbfs-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CORS_ORIGIN = "*"
# R2 bucket name (S3-compat presigned URL path-style addressing).
R2_BUCKET_NAME = "ctbk"
# r2.dev public URL — anonymous direct reads from R2. Used as a sync
# `getUrl(path)` fallback when the browser opts out of presigning.
R2_PUBLIC_BASE_URL = "https://pub-4856603e85b34753b7e6bffb89411803.r2.dev"

[[d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "d5746734-70ba-46aa-8780-be09e4837f0b"

[[r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Slack alerting cron — `alerts.ts` evaluates threshold rules against the
# health snapshot and posts to #ctbk-bot on firing/resolved transitions.
# Requires `SLACK_BOT_TOKEN` wrangler secret; alerts are disabled if absent.
[triggers]
crons = ["*/5 * * * *"]
