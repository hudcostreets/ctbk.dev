name = "ctbk-gbfs-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CORS_ORIGIN = "*"
# R2 bucket name (S3-compat presigned URL path-style addressing).
R2_BUCKET_NAME = "ctbk"
# r2.dev public URL — anonymous direct reads from R2. Used as a sync
# `getUrl(path)` fallback when the browser opts out of presigning.
R2_PUBLIC_BASE_URL = "https://pub-4856603e85b34753b7e6bffb89411803.r2.dev"
# Pyrmts avail-shadow flag. `'1'` runs the pyrmts-based reader in parallel
# with the legacy path on every `/api/totals?kind=availability`, logging
# a delta for shadow-mode parity validation. See specs/pyrmts-avail-port.md.
# Remove (or set anything other than '1') when validation is complete.
AVAIL_PYRMTS_SHADOW = "1"

[[d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "d5746734-70ba-46aa-8780-be09e4837f0b"

# RIDES_V3_COARSE — `/api/rides-v3?backend=d1` queries this. Holds
# the v3 COARSE bundle (1d-1y tiers, both anchors, ~6.6 GB; INT-encoded
# dim columns per `ctbk/rides_d1.py` so `tmp/d1/v3-coarse.sqlite` fits
# under 10 GB). Worker decodes INT→string via `DIM_DECODE` in
# `src/rides_v1.ts`. Provisioned 2026-06-07.
# Bulk-load: `wrangler d1 import RIDES_V3_COARSE --file=tmp/d1/v3-coarse.sqlite --remote`.
[[d1_databases]]
binding = "RIDES_V3_COARSE"
database_name = "ctbk-rides-v3-coarse"
database_id = "493af275-0ffd-4abf-9676-f0bf0869bc9f"

[[r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Slack alerting cron — `alerts.ts` evaluates threshold rules against the
# health snapshot and posts to #ctbk-bot on firing/resolved transitions.
# Requires `SLACK_BOT_TOKEN` wrangler secret; alerts are disabled if absent.
[triggers]
crons = ["*/5 * * * *"]

# ─── Dev environment ───────────────────────────────────────────────────
# Sibling worker at `ctbk-gbfs-api-dev.ryan-0dc.workers.dev` for iterating
# on backend changes without touching production. Same R2/D1 bindings (so
# behavior is identical against real data); cron disabled (don't want both
# prod and dev firing Slack alerts every 5 minutes).
#
# Deploy: `wrangler deploy --env dev` from /gbfs/api. ~15s, no GHA.
# Secrets: set separately via `wrangler secret put --env dev <NAME>`
# (Slack token, etc.; reuse prod values).
# FE: pass `?api=dev` (or `VITE_API_BASE_DEV=…` at build time) to route
# queries at the dev worker — see `www/src/query/stations.ts`.
[env.dev]
name = "ctbk-gbfs-api-dev"

[env.dev.vars]
CORS_ORIGIN = "*"
R2_BUCKET_NAME = "ctbk"
R2_PUBLIC_BASE_URL = "https://pub-4856603e85b34753b7e6bffb89411803.r2.dev"
AVAIL_PYRMTS_SHADOW = "1"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "d5746734-70ba-46aa-8780-be09e4837f0b"

[[env.dev.d1_databases]]
binding = "RIDES_V3_COARSE"
database_name = "ctbk-rides-v3-coarse"
database_id = "493af275-0ffd-4abf-9676-f0bf0869bc9f"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Disable cron on dev — prod already fires `*/5 * * * *` for Slack alerts;
# we don't want dev double-firing.
[env.dev.triggers]
crons = []
