name = "ctbk-gbfs-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# satori (og:image rendering) references `process.env` at runtime.
compatibility_flags = ["nodejs_compat"]

# Smart Placement: ask CF to migrate the Worker toward its heaviest
# bindings (R2 + D1 shard-registry, both ENAM).
[placement]
mode = "smart"

[vars]
CORS_ORIGIN = "*"
# R2 bucket name (S3-compat presigned URL path-style addressing).
R2_BUCKET_NAME = "ctbk"
# r2.dev public URL — anonymous direct reads from R2. Used as a sync
# `getUrl(path)` fallback when the browser opts out of presigning.
R2_PUBLIC_BASE_URL = "https://pub-4b6c7e01aa2349b8b8d6ed788df2a9d1.r2.dev"
# Folded into the `/api/rides*` edge-cache key; bump on a data repair so
# cached past-window responses rotate (`specs/station-id-trailing-zero.md`).
RIDES_CACHE_GEN = "trailing-zero-repair"
# `/api/tl` (`src/tl.ts`): R2 prefix of the time-first `rides-tl-{start,end}`
# pyramids (`specs/timelapse-map.md`; `rides-tl` = the full-history build,
# `rides-tl-p0b` = the 2025-06 scratch build). Part of the edge-cache key.
# Set `TL_CANONICALIZED = "1"` once `canonicalize` has run on the prefix
# (materialized `c:` rows).
TL_PREFIX = "rides-tl"

# Bundle .ttf font files as raw bytes (satori og:image rendering).
# NOTE: defining ANY [[rules]] displaces wrangler's defaults, so the
# wasm rule (normally built-in) must be restated for resvg.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "845e34bb-d138-4076-9955-5909e30d4323"

[[r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Workers Analytics Engine: per-request data points (route, workerColo,
# perCallMs, status). Free up to 25M writes/day per account; queryable
# via the CF GraphQL API. Used to track per-route p50/p99 over time.
[[analytics_engine_datasets]]
binding = "PERF"
dataset = "ctbk_perf"

# Cron triggers (scheduled() handler in `index.ts`): refresh the
# /api/health snapshot cache + Slack alerts (threshold rules, posts
# firing/resolved transitions to `#ctbk-bot`; idempotent).
[triggers]
crons = ["* * * * *"]

# ─── Dev environment ───────────────────────────────────────────────────
# Sibling worker at `ctbk-gbfs-api-dev.ryan-0dc.workers.dev` for iterating
# on backend changes without touching production. Same R2/D1 bindings (so
# behavior is identical against real data); cron disabled (don't want both
# prod and dev firing Slack alerts every 5 minutes).
#
# Deploy: `wrangler deploy --env dev` from /gbfs/api. ~15s, no GHA.
# Secrets: set separately via `wrangler secret put --env dev <NAME>`
# (Slack token, etc.; reuse prod values).
# FE: pass `?api=dev` (or `VITE_API_BASE_DEV=…` at build time) to route
# queries at the dev worker — see `www/src/query/stations.ts`.
[env.dev]
name = "ctbk-gbfs-api-dev"

# Same Smart Placement on dev. CF needs a handful of invocations to
# gather routing telemetry before it migrates the Worker.
[env.dev.placement]
mode = "smart"

[env.dev.vars]
CORS_ORIGIN = "*"
R2_BUCKET_NAME = "ctbk"
R2_PUBLIC_BASE_URL = "https://pub-4b6c7e01aa2349b8b8d6ed788df2a9d1.r2.dev"
# Candidate rollout (`src/serve_config.ts`; `specs/station-id-trailing-zero.md`
# §Candidate rollout): point dev at candidate data, leave prod on the
# defaults. Unset/empty ⇒ prod's `rides` / `station-luc.json` /
# `stations/station-canonicalize-map.json` / `stations/rides-extra-stations.json`.
# RIDES_PYRAMID = "rides-next"
# STATION_LUC_KEY = "station-luc.<hash12>.json"
# CANON_MAP_KEY = "stations/station-canonicalize-map.<hash12>.json"
# EXTRA_STATIONS_KEY = "stations/rides-extra-stations.<hash12>.json"
# RIDES_CACHE_GEN = "<label>"  # folded into the `/api/rides*` edge-cache key
# `/api/tl` (`src/tl.ts`): same knobs as prod's — the prefix is part of the
# edge-cache key; `TL_CANONICALIZED = "1"` only once `canonicalize` has run
# on it; `TL_HTTP_BASE = "https://data.ctbk.dev"` reads shards over HTTP
# instead of the R2 binding (unset = R2).
TL_PREFIX = "rides-tl"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ctbk-gbfs"
database_id = "845e34bb-d138-4076-9955-5909e30d4323"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "ctbk"

# Same AE binding on dev — diagnostic runs against dev should also write
# data points (dataset is shared with prod; filter by `script_name` in
# queries to disambiguate).
[[env.dev.analytics_engine_datasets]]
binding = "PERF"
dataset = "ctbk_perf"

# Disable cron on dev — prod already fires `*/5 * * * *` for Slack alerts;
# we don't want dev double-firing.
[env.dev.triggers]
crons = []
