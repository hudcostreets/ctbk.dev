name = "ctbk-gbfs-poller-v11"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ctbk"

# Lyft requests go through the US-placed fetch proxy (`gbfs/fetcher/`); see
# its wrangler.toml for why. Deploy `ctbk-gbfs-fetch` before this worker.
[[services]]
binding = "FETCH"
service = "ctbk-gbfs-fetch"
